<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Backroom</title>
  <!--
    A favicon is not a scaled-down brand mark. It is drawn for the size it will
    actually be seen at: 16px in a tab, sometimes 32px on a retina display.

    This is the same door-in-a-doorway as BrandMark.tsx, but simplified for the
    constraint. The brand mark's leaf has a small knob punched out of it and a
    thin arch across the top; at 16px that reads as a grey smudge. The previous
    version shipped the badge in #171717, which is nearly the colour of dark
    browser chrome, so the mark was technically present and practically
    invisible.

    Three changes, all in service of legibility at 16px:

    1. The badge is a saturated brand green rather than a near-black neutral, so
       it separates from dark tab bars and from light ones.
    2. The knob is dropped. Two pixels is below the threshold where a hole reads
       as a knob rather than as noise, and its absence costs nothing because the
       silhouette still says "door".
    3. The leaf is widened and the opening behind it is dropped, so the shape is
       one solid form instead of two nested arcs that merge when rasterised.

    The door is left slightly ajar: the jamb sliver on the right is what makes it
    read as a door rather than a rectangle. Closed, it would be a plain square.

    Geometry is intentionally NOT kept in step with BrandMark.tsx. That file
    carries an animated leaf; this one carries a static one drawn for a
    different constraint. Sharing path data between them is what produced the
    original problem.

    Note: no double hyphens in this comment. XML forbids them inside a comment,
    and a single stray one makes the whole file fail to parse, which browsers
    report as no favicon at all.
  -->
  <rect width="24" height="24" rx="5" fill="#15803d" />
  <path d="M7 19.5V8.75a5 5 0 0 1 10 0V19.5Z" fill="#f0fdf4" />
  <rect x="17" y="8.75" width="1.75" height="10.75" fill="#15803d" />
</svg>
